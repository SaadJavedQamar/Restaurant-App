  <path d="M256 80 Q 276 50 256 20" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M322 90 Q 342 60 322 30" stroke="#ea580c" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
