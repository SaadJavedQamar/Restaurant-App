  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Cloche / Plate bell dome -->
  <path d="M256 120 C242 120 232 130 232 144 C232 148 233 151 235 154 C160 168 112 226 112 296 L400 296 C400 226 352 168 277 154 C279 151 280 148 280 144 C280 130 270 120 256 120 Z" fill="url(#grad)"/>
